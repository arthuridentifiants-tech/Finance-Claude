function loanChart(L, c) {
  const W = 340, H = 130, n = c.n, step = Math.max(1, Math.round(n / 80));
  const X = m => (m / n * W), Y = m => H - (c.amt > 0 ? (c.amt - c.crdAt(m)) / c.amt : 0) * H;
  const ms = []; for (let m = 0; m <= n; m += step) ms.push(m); if (ms[ms.length - 1] !== n) ms.push(n);
  const pathOf = arr => arr.map((m, j) => (j ? 'L' : 'M') + X(m).toFixed(1) + ',' + Y(m).toFixed(1)).join(' ');
  const past = ms.filter(m => m < c.k); past.push(c.k);
  const full = pathOf(ms), pastD = pathOf(past);
  const areaD = pastD + ` L${X(c.k).toFixed(1)},${H} L0,${H} Z`;
  const tx = X(c.k), ty = Y(c.k);
  const anchor = tx > W - 70 ? 'end' : (tx < 40 ? 'start' : 'middle');
  const [sy, sm] = String(L.start || '').split('-').map(Number);
  return `<svg viewBox="0 0 ${W} ${H + 26}" width="100%" role="img" aria-label="Courbe de remboursement" style="display:block; overflow:visible;">
    <line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--border)" stroke-width="1"/>
    <path d="${full}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
    <path d="${areaD}" fill="var(--up)" fill-opacity="0.22" style="opacity:0; animation: fadeIn 1s ease-out 0.9s forwards;"/>
    <path d="${pastD}" pathLength="1" fill="none" stroke="var(--up)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:1; stroke-dashoffset:1; animation: drawLine 1.6s ease-out 0.1s forwards;"/>
    <g style="opacity:0; animation: fadeIn 0.4s ease-out 1.5s forwards;">
      <circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="5.5" fill="var(--up)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${tx.toFixed(1)}" y="${Math.max(12, ty - 11).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="700" style="fill:var(--ink)">Aujourd’hui · ${Math.round(c.pct * 100)} %</text>
    </g>
    <text x="0" y="${H + 18}" font-size="11" font-weight="600" style="fill:var(--muted)">${sm ? MONTH_NAMES[sm - 1].slice(0, 4).toLowerCase() + '. ' : ''}${sy || ''}</text>
    <text x="${W}" y="${H + 18}" text-anchor="end" font-size="11" font-weight="600" style="fill:var(--muted)">${MONTH_NAMES[c.endM].slice(0, 4).toLowerCase()}. ${c.endY}</text>
  </svg>`;
}

/* Coût du crédit : répartition intérêts / capital de chaque mensualité */
function loanCostChart(c) {
  const W = 340, H = 110, n = c.n, step = Math.max(1, Math.round(n / 90));
  const ms = []; for (let m = 1; m <= n; m += step) ms.push(m); if (ms[ms.length - 1] !== n) ms.push(n);
  const X = m => ((m - 1) / Math.max(1, n - 1) * W);
  const part = m => c.pmt > 0 ? Math.min(1, Math.max(0, c.crdAt(m - 1) * c.i / c.pmt)) : 0;
  const bound = ms.map(m => X(m).toFixed(1) + ',' + (part(m) * H).toFixed(1));
  const top = ms.map(m => X(m).toFixed(1) + ',0');
  const interestPoly = top.join(' ') + ' ' + bound.slice().reverse().join(' ');
  const principalPoly = bound.join(' ') + ` ${W},${H} 0,${H}`;
  const p1 = part(1), pn = part(n);
  let today = '';
  if (c.k > 0 && c.k < n) {
    const tx = X(c.k).toFixed(1), anchor = c.k / n > 0.8 ? 'end' : 'middle';
    today = `<line x1="${tx}" x2="${tx}" y1="0" y2="${H}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="${tx}" y="${H + 14}" text-anchor="${anchor}" font-size="10.5" font-weight="700" style="fill:var(--ink)">Aujourd’hui</text>`;
  }
  const lab = (x, y, t, anchor) => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="#fff" stroke="rgba(0,0,0,0.3)" stroke-width="3" paint-order="stroke">${t}</text>`;
  return `<svg viewBox="0 0 ${W} ${H + 26}" width="100%" role="img" aria-label="Part des intérêts et du capital dans la mensualité" style="display:block; overflow:visible;">
    <polygon points="${principalPoly}" style="fill:var(--up)" fill-opacity="0.85"/>
    <polygon points="${interestPoly}" style="fill:var(--warn)" fill-opacity="0.9"/>
    ${p1 >= 0.12 ? lab(6, Math.min(H - 6, p1 * H / 2 + 4), Math.round(p1 * 100) + ' % intérêts', 'start') : ''}
    ${(1 - pn) >= 0.12 ? lab(W - 6, pn * H + (1 - pn) * H / 2 + 4, Math.round((1 - pn) * 100) + ' % capital', 'end') : ''}
    ${today}
    <text x="0" y="${H + 14}" font-size="11" font-weight="600" style="fill:var(--muted)">Début</text>
    <text x="${W}" y="${H + 14}" text-anchor="end" font-size="11" font-weight="600" style="fill:var(--muted)">Fin</text>
  </svg>`;
}

function loanCostBlock(c) {
  const insTot = c.ins * c.n, total = c.interest + insTot;
  const paid = Math.max(0, c.pmt * c.k - (c.amt - c.crd));
  const it1 = c.amt * c.i, itN = c.crdAt(c.n - 1) * c.i;
  const chart = h('div', { style: 'margin: 10px 0 6px;' }); chart.innerHTML = loanCostChart(c);
  const dot = col => h('span', { style: `width: 10px; height: 10px; border-radius: 50%; background: ${col}; flex: none;` });
  const line = (a, b) => h('div', { style: 'display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 12.5px;' },
    h('span', { style: 'color: var(--muted);' }, a), h('span', { class: 'num', style: 'font-weight: 700; text-align: right;' }, b));
  return h('div', { style: 'margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border);' },
    h('div', { style: 'font-weight: 700; font-size: 14px;' }, 'Coût du crédit'),
    h('div', { style: 'font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.45;' },

    h('div', { class: 'stat-grid' },
      h('div', { class: 'stat-box' }, h('div', { class: 'k' }, 'Coût total du crédit' + (insTot > 0 ? ' (assurance incluse)' : '')), h('div', { class: 'v num', style: 'color: var(--warn);' }, E0.format(total))),
      h('div', { class: 'stat-box' }, h('div', { class: 'k' }, 'Intérêts totaux'), h('div', { class: 'v num' }, E0.format(c.interest))),
      h('div', { class: 'stat-box' }, h('div', { class: 'k' }, 'Intérêts déjà payés'), h('div', { class: 'v num' }, E0.format(paid))),
      h('div', { class: 'stat-box' }, h('div', { class: 'k' }, 'Intérêts restants'), h('div', { class: 'v num' }, E0.format(Math.max(0, c.interest - paid))))
    ),
    chart,
    h('div', { style: 'display: flex; gap: 16px; justify-content: center; font-size: 12px; font-weight: 600; margin-bottom: 8px;' },
      h('span', { style: 'display: inline-flex; align-items: center; gap: 6px;' }, dot('var(--warn)'), 'Intérêts'),
      h('span', { style: 'display: inline-flex; align-items: center; gap: 6px;' }, dot('var(--up)'), 'Capital remboursé')
    ),
    line('1re mensualité', `${E0.format(it1)} d’intérêts · ${E0.format(c.pmt - it1)} de capital`),
    line('Dernière mensualité', `${E0.format(itN)} d’intérêts · ${E0.format(c.pmt - itN)} de capital`),
    c.k > 0 && c.k < c.n ? line('Mensualité actuelle', `${E0.format(c.crdAt(c.k) * c.i)} d’intérêts · ${E0.format(c.pmt - c.crdAt(c.k) * c.i)} de capital`) : null
  );
}

/* Éditeur de crédit commun : immobilier (depuis Patrimoine) et voiture / conso (depuis Frais) */
function openLoanEditor({ title, intro, loan, withKind, kind, name, onSave, onDelete }) {
  const root = $('#modal-root'), close = () => { root.innerHTML = ''; };
  const L = loan || {}, now = new Date();
  const defStart = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  let k = kind || 'auto';
  const months0 = Math.round((L.yrs || 0) * 12);
  let unit = !L.yrs ? (withKind ? 'm' : 'y') : (withKind ? 'm' : (months0 % 12 === 0 ? 'y' : 'm'));
  const mk = (v, ph) => h('input', { type: 'text', inputmode: 'decimal', placeholder: ph, value: v != null && v !== 0 ? v : '' });
  const nameIn = h('input', { type: 'text', placeholder: LOAN_KINDS.find(z => z[0] === k)[2], value: name || '' });
  const amtIn = mk(L.amt, 'ex. 15000');
  const rateIn = mk(L.rate, 'ex. 4.90');
  const durIn = mk(L.yrs ? (unit === 'y' ? L.yrs : months0) : '', unit === 'y' ? 'ex. 20' : 'ex. 48');
  const startIn = h('input', { type: 'month', value: L.start || defStart });
  const insIn = mk(L.ins, '0');
  const feesIn = mk(L.fees, '0');
  const read = () => { const d = pf(durIn.value); return { amt: pf(amtIn.value), rate: pf(rateIn.value), yrs: unit === 'y' ? d : d / 12, start: startIn.value, ins: pf(insIn.value) || 0, fees: pf(feesIn.value) || 0 }; };
  const ok = x => x.amt > 0 && x.yrs > 0 && isFinite(x.rate) && x.rate >= 0 && x.start;
  const stat = (t, v, col) => h('div', { style: 'padding: 8px 10px; border-radius: 10px; background: var(--surface-alt); min-width: 0;' },
    h('div', { style: 'font-size: 11px; color: var(--muted); font-weight: 600;' }, t),
    h('div', { class: 'num', style: 'font-weight: 800; font-size: 14px;' + (col ? ` color: ${col};` : '') }, v));
  const prev = h('div', { style: 'display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;' });
  const upd = () => {
    const x = read();
    if (!ok(x)) { prev.replaceChildren(h('div', { style: 'grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); line-height: 1.45;' }, 'Renseignez capital, taux, durée et date : la mensualité et le coût total s’afficheront ici.')); return; }
    const c = loanCalc(x);
    prev.replaceChildren(stat('Mensualité' + (x.ins ? ' + assur.' : ''), E2.format(c.tot)), stat('Coût total', E0.format(c.cost), 'var(--down)'), stat('Reste dû', E0.format(c.crd)));
  };
  [amtIn, rateIn, durIn, startIn, insIn, feesIn].forEach(i => { i.oninput = upd; });

  const kindRow = withKind ? h('div', { class: 'full-col chips-row' }, ...LOAN_KINDS.map(([id, label, def]) => {
    const b = h('button', { class: 'chip-btn', type: 'button', 'aria-pressed': String(k === id), onclick: () => {
      k = id; nameIn.placeholder = def;
      kindRow.querySelectorAll('button').forEach((x, j) => x.setAttribute('aria-pressed', String(LOAN_KINDS[j][0] === k)));
    } }, label);
    return b;
  })) : null;
  const unitBtns = [['y', 'Années'], ['m', 'Mois']].map(([u, t]) => h('button', { class: 'chip-btn', type: 'button', 'aria-pressed': String(unit === u), style: 'padding: 4px 10px; font-size: 12px;', onclick: () => {
    const cur = pf(durIn.value);
    if (isFinite(cur) && cur > 0 && u !== unit) durIn.value = String(u === 'y' ? +(cur / 12).toFixed(2) : Math.round(cur * 12));
    unit = u; durIn.placeholder = u === 'y' ? 'ex. 20' : 'ex. 48';
    unitBtns.forEach((x, j) => x.setAttribute('aria-pressed', String(['y', 'm'][j] === unit)));
    upd();
  } }, t));
  const fg = (label, el, full) => h('div', { class: 'form-group' + (full ? ' full-col' : '') }, h('label', { class: 'form-label' }, label), el);

  const modal = h('div', { class: 'modal-overlay', onclick: ev => { if (ev.target === modal) close(); } },
    h('div', { class: 'modal-sheet', style: 'max-width: 460px;' },
      h('div', { class: 'modal-header' }, h('div', { class: 'modal-title' }, title), h('button', { class: 'btn-icon-only', onclick: close }, getIcon('x', 16))),
      h('div', { class: 'modal-body form-grid' },
        intro ? h('div', { class: 'full-col', style: 'font-size: 13px; color: var(--ink-secondary); line-height: 1.45;' }, intro) : null,
        kindRow,
        withKind ? fg('Nom (optionnel)', nameIn, true) : null,
        fg('Capital emprunté (€)', amtIn, true),
        fg('Taux annuel (%, hors assurance)', rateIn),
        h('div', { class: 'form-group' }, h('label', { class: 'form-label' }, 'Durée'), h('div', { style: 'display: flex; gap: 6px; align-items: center;' }, durIn, ...unitBtns)),
        fg('Date de la 1re mensualité', startIn, true),
        h('div', { class: 'full-col', style: 'font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px;' }, 'Options'),
        fg('Assurance (€ / mois)', insIn),
        fg('Frais dossier + garantie (€)', feesIn),
        h('div', { class: 'full-col' }, prev),
        onDelete ? h('div', { class: 'full-col' }, h('button', { class: 'btn btn-danger btn-sm', onclick: () => { close(); onDelete(); } }, getIcon('trash', 14), 'Supprimer le crédit')) : null),
      h('div', { class: 'modal-footer' },
        h('button', { class: 'btn btn-secondary', onclick: close }, 'Annuler'),
        h('button', { class: 'btn btn-primary', onclick: () => {
          const x = read();
          if (!ok(x)) { toast('Complétez le capital, le taux, la durée et la date', 'error'); return; }
          close(); onSave(x, { kind: k, name: nameIn.value.trim() });
        } }, 'Enregistrer'))));
  root.replaceChildren(modal);
  upd();
}

function openDebtEditor(d) {

    },
    onDelete: d ? () => { S.loans = loansList().filter(z => z !== d); save(); toast('Crédit supprimé'); render(); } : null
  });
}

/* ==================== SIMULATEUR LOCATAIRE VS PROPRIÉTAIRE ==================== */

const SIM_DEF = { v: 2, price: 172093, apport: 35000, notary: 7.5, rate: 3.7, yrs: 25, ins: 0.30, taxe: 800, copro: 0, maint: 1, growth: 1.5, sell: 5, rent: 770, rentG: 1.5, ret: 4, hor: 40 };

function simRent(P) {
  const n = Math.max(1, Math.round(P.yrs * 12)), Hm = Math.max(12, Math.round(P.hor * 12)), i = P.rate / 1200;
  const total = P.price * (1 + P.notary / 100);
  const loan = Math.max(0, total - P.apport);
  const pmt = loan > 0 ? (i > 0 ? loan * i / (1 - Math.pow(1 + i, -n)) : loan / n) : 0;
  const ins = loan * P.ins / 100 / 12;
  const mr = Math.pow(1 + P.ret / 100, 1 / 12) - 1;
  let tenant = P.apport, owner = Math.max(0, P.apport - total), bal = loan;
  const rows = [{ y: 0, owner: P.price * (1 - P.sell / 100) - loan + owner, tenant, value: P.price, crd: loan }];
  let first = null;
  for (let m = 1; m <= Hm; m++) {
    const f = Math.pow(1 + P.rentG / 100, Math.floor((m - 1) / 12));
    const value = P.price * Math.pow(1 + P.growth / 100, m / 12);
    if (m <= n) { bal = m === n ? 0 : Math.max(0, bal - (pmt - bal * i)); }
    const oOut = (m <= n ? pmt + ins : 0) + (P.copro + P.taxe / 12) * f + value * P.maint / 100 / 12;
    const rOut = P.rent * f;
    if (m === 1) first = { credit: pmt, ins, charges: (P.copro + P.taxe / 12), maint: value * P.maint / 100 / 12, own: oOut, rent: rOut };
    tenant *= 1 + mr; owner *= 1 + mr;
    const d = oOut - rOut;
    if (d > 0) tenant += d; else owner += -d;
    if (m % 12 === 0) rows.push({ y: m / 12, owner: value * (1 - P.sell / 100) - bal + owner, tenant, value, crd: bal });
  }
  return { rows, first, loan, pmt };
}

function simChart(rows, hor) {
  const W = 340, H = 150, all = rows.flatMap(r => [r.owner, r.tenant]);
  const mx = Math.max(...all, 1), mn = Math.min(0, ...all), span = (mx - mn) || 1, Hy = Math.max(1, rows[rows.length - 1].y);
  const X = y => (y / Hy * W).toFixed(1), Y = v => (H - (v - mn) / span * H).toFixed(1);
  const line = k => rows.map(r => X(r.y) + ',' + Y(r[k])).join(' ');
  const be = rows.find(r => r.y > 0 && r.owner >= r.tenant);
  const zero = mn < 0 ? `<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--border)" stroke-dasharray="3 3"/>` : '';
  const beMark = be ? `<line x1="${X(be.y)}" x2="${X(be.y)}" y1="0" y2="${H}" stroke="var(--muted)" stroke-dasharray="3 3"/>
      <text x="${X(be.y)}" y="-4" text-anchor="${be.y / Hy > 0.8 ? 'end' : 'middle'}" font-size="10.5" font-weight="700" style="fill:var(--ink)">Année ${be.y}</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H + 24}" width="100%" role="img" aria-label="Patrimoine locataire et propriétaire" style="display:block; overflow:visible; margin-top:14px;">
    <line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--border)"/>${zero}${beMark}
    <polyline fill="none" stroke="var(--primary)" stroke-width="2.8" stroke-linejoin="round" points="${line('tenant')}"/>
    <polyline fill="none" stroke="var(--up)" stroke-width="2.8" stroke-linejoin="round" points="${line('owner')}"/>
    <text x="0" y="${H + 18}" font-size="11" font-weight="600" style="fill:var(--muted)">Aujourd’hui</text>
    <text x="${W}" y="${H + 18}" text-anchor="end" font-size="11" font-weight="600" style="fill:var(--muted)">Dans ${Hy} ans</text>
  </svg>`;
}

/* ===== Crédits dans l'onglet Frais : coût total et courbe cumulée ===== */
function loansCostChart(items) {
  const now = new Date(), nowAbs = now.getFullYear() * 12 + now.getMonth();
  const info = items.map(({ L, c }) => { const [sy, sm] = String(L.start || '').split('-').map(Number); return { c, s0: (sy || now.getFullYear()) * 12 + ((sm || 1) - 1) }; });
  const t0 = Math.min(...info.map(x => x.s0)), t1 = Math.max(...info.map(x => x.s0 + x.c.n - 1));
  const span = Math.max(1, t1 - t0);
  const cum = (x, t) => {
    if (t < x.s0) return 0;
    const m = Math.max(0, Math.min(x.c.n, t - x.s0 + 1));
    return x.c.fees + x.c.pmt * m - (x.c.amt - x.c.crdAt(m)) + x.c.ins * m;
  };
  const total = t => info.reduce((q, x) => q + cum(x, t), 0);
  const W = 340, H = 130, TOP = 26, max = Math.max(1, total(t1)), step = Math.max(1, Math.round(span / 90));
  const X = t => (t - t0) / span * W, Y = v => TOP + (H - TOP) * (1 - v / max);   // marge en haut : la courbe ne touche jamais le texte
  const ts = []; for (let t = t0; t <= t1; t += step) ts.push(t); if (ts[ts.length - 1] !== t1) ts.push(t1);
  const line = ts.map((t, j) => (j ? 'L' : 'M') + X(t).toFixed(1) + ',' + Y(total(t)).toFixed(1)).join(' ');
  const area = line + ` L${W},${H} L0,${H} Z`;
  const lab = t => `${MONTH_NAMES[((t % 12) + 12) % 12].slice(0, 4).toLowerCase()}. ${Math.floor(t / 12)}`;
  let today = '';
  if (nowAbs > t0 && nowAbs < t1) {
    const tx = X(nowAbs), tv = total(nowAbs), anchor = tx > W - 90 ? 'end' : tx < 60 ? 'start' : 'middle';
    today = `<line x1="${tx.toFixed(1)}" x2="${tx.toFixed(1)}" y1="${TOP}" y2="${H}" style="stroke:var(--ink)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
      <circle cx="${tx.toFixed(1)}" cy="${Y(tv).toFixed(1)}" r="5" style="fill:var(--down);stroke:var(--surface)" stroke-width="2"/>
      <text x="${tx.toFixed(1)}" y="${(Y(tv) - 10).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="700" style="fill:var(--ink)">Payé : ${E0.format(tv)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H + 26}" width="100%" role="img" aria-label="Coût cumulé des crédits" style="display:block; overflow:visible;">
    <text x="0" y="12" font-size="12" font-weight="800" style="fill:var(--down)">Coût total : ${E0.format(max)}</text>
    <line x1="0" x2="${W}" y1="${H}" y2="${H}" style="stroke:var(--border)" stroke-width="1"/>
    <path d="${area}" style="fill:var(--down)" fill-opacity="0.14"/>
    <path d="${line}" fill="none" style="stroke:var(--down)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${today}
    <text x="0" y="${H + 18}" font-size="11" font-weight="600" style="fill:var(--muted)">${lab(t0)}</text>
    <text x="${W}" y="${H + 18}" text-anchor="end" font-size="11" font-weight="600" style="fill:var(--muted)">${lab(t1)}</text>
  </svg>`;
}

function projCard(v, s) {
  const st = S.proj || (S.proj = { r: 5, n: 20 });

  const renderProj = () => {
    st.r = pf(rIn.value) || 0;
    save();
    chipsRow.querySelectorAll('.chip-btn').forEach((b, idx) => {
      b.setAttribute('aria-pressed', String(horizons[idx] === st.n));
    });

  };

  return container;
}

function generateProjGraph(v, s, st) {
  if (!v) {
    return [h('div', { class: 'card', style: 'padding: 20px; text-align: center; color: var(--muted);' }, 'Ajoutez du patrimoine pour visualiser la projection.')];
  }
  const r = st.r / 100, rate = v > 0 ? s.p / v : 0;
  const A = [v], B = [v];
  let a = v, b = v, paid = 0;
  for (let y = 1; y <= st.n; y++) {
    a *= 1 + r;
    const f = b * rate + s.x;
    b = Math.max(0, b * (1 + r) - f);
    paid += f;
    A.push(a);
    B.push(b);
  }
  const cost = a - b;

  const W = 340, H = 140, mx = Math.max(...A) || 1;
  const X = i => (i / (A.length - 1) * W).toFixed(1);
  const Y = q => (H - q / mx * H).toFixed(1);
  const pa = A.map((q, i) => X(i) + ',' + Y(q)).join(' ');
  const pb = B.map((q, i) => X(i) + ',' + Y(q)).join(' ');
  const area = pa + ' ' + B.map((q, i) => [i, q]).reverse().map(([i, q]) => X(i) + ',' + Y(q)).join(' ');

  const svg = h('div', { style: 'margin: 14px 0;' });
  svg.innerHTML = `
    <svg viewBox="0 0 ${W} ${H + 24}" width="100%" role="img" aria-label="Projection frais" style="display:block; overflow:visible;">
      <polygon points="${area}" fill="var(--warn)" opacity="0.25"/>
      <line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--border)" stroke-width="1"/>
      <polyline fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4" points="${pa}"/>
      <polyline fill="none" stroke="var(--primary)" stroke-width="2.5" points="${pb}"/>
      <text x="0" y="${H + 18}" font-size="11" font-weight="600" fill="var(--muted)">Aujourd’hui</text>
      <text x="${W}" y="${H + 18}" text-anchor="end" font-size="11" font-weight="600" fill="var(--muted)">Dans ${st.n} ans</text>
    </svg>
  `;

  return [
    h('div', { class: 'card', style: 'padding: 16px 20px;' },
      h('div', { style: 'font-size: 13px; color: var(--muted);' }, `Sur ${st.n} ans, vos frais amputeraient votre capital de :`),
      h('div', { class: 'hero-val num down', style: 'font-size: 26px; margin: 4px 0 10px;' }, `− ${E0.format(cost)}`),
      svg,
      h('div', { class: 'list', style: 'margin-top: 12px; border-top: 1px solid var(--border); padding-top: 8px;' },
        h('div', { style: 'display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px;' },
          h('span', { style: 'color: var(--muted);' }, 'Capital théorique (0% de frais)'),
          h('span', { class: 'num', style: 'font-weight: 600;' }, E0.format(a))
        ),
        h('div', { style: 'display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px;' },
          h('span', { style: 'color: var(--ink); font-weight: 600;' }, 'Capital réel projeté'),
          h('span', { class: 'num up', style: 'font-weight: 700;' }, E0.format(b))
        ),
        h('div', { style: 'display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px;' },
          h('span', { style: 'color: var(--down);' }, 'Manque à gagner en intérêts composés'),
          h('span', { class: 'num down', style: 'font-weight: 600;' }, E0.format(Math.max(0, cost - paid)))
        )
      )
    )
  ];
}

const MONTH_NAMES = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
let strategyYear = new Date().getFullYear();

function getStrategy(y) {
  S.st = S.st || {};
  return S.st[y] = S.st[y] || { b: [], p: [], pd: {} };
}

const nowMonth = () => new Date().getMonth(), nowYear = () => new Date().getFullYear();
const isDueBuy = (b, y) => !b.done && (y < nowYear() || (y === nowYear() && b.m <= nowMonth()));

function pendProv(y) {
  const T = getStrategy(y), last = y < nowYear() ? 11 : y === nowYear() ? nowMonth() : -1, o = [];
  T.p.forEach(p => {
    for (let m = p.f || 0; m <= last; m++) {
      if (!(T.pd[m] || []).includes(p.id)) o.push({ p, m });
    }
  });
  return o;
}

function applyProv(p, m, y) {
  const e = S.envs.find(x => x.id === p.env);
  if (!e) { openAlertModal('Erreur', 'Enveloppe réceptrice introuvable.'); return; }
  const nm = 'Provision · ' + p.name;
  let l = e.lines.find(x => !x.m && x.name === nm);
  if (!l) {
    l = { id: uid(), name: nm, val: 0, cst: 0, divs: [] };
    e.lines.push(l);
  }
  l.val += p.amt;
  l.cst += p.amt;
  const T = getStrategy(y);
  (T.pd[m] = T.pd[m] || []).push(p.id);
  save();
  toast(`${E0.format(p.amt)} provisionnés sur « ${e.name} »`);
  render();
}

}

/* ==================== OBJECTIFS DE VIE ==================== */
const GOAL_TYPES = ['Résidence principale', 'Mariage', 'Enfant(s)', 'Voiture', 'Retraite', 'Voyage', 'Autre'];
const gl = () => (S.goals = S.goals || []);
const fmtGoalDate = d => d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
const monthsLeft = d => Math.max(0, (d.getFullYear() - nowYear()) * 12 + d.getMonth() - nowMonth());
const isGoalDone = (g, x) => x.funded >= g.target - 0.5;

// Achats et provisions déjà prévus dans la stratégie vers les enveloppes de l'objectif jusqu'à son échéance
function plannedForGoal(g, gd) {
  let total = 0;
  for (const y in (S.st || {})) {
    const T = S.st[y], Y = +y;
    if (Y < nowYear() || Y > gd.getFullYear()) continue;
    T.b.forEach(b => {
      if (!b.done && g.envs.includes(b.env) && (Y < gd.getFullYear() || b.m <= gd.getMonth())) total += b.amt;
    });
    T.p.forEach(p => {
      if (!g.envs.includes(p.env)) return;
      for (let m = (Y === nowYear() ? nowMonth() : 0); m <= (Y < gd.getFullYear() ? 11 : gd.getMonth()); m++) {
        if (m >= (p.f || 0) && !(T.pd[m] || []).includes(p.id)) total += p.amt;
      }
    });
  }
  return total;
}

// Répartition des enveloppes entre objectifs par échéance chronologique (premier servi sans double comptage)
function goalCalc(mode) {
  mode = mode || S.gm || 'net';
  const rem = {}, out = {};
  S.envs.forEach(e => {
    const a = agg(e.lines);
    rem[e.id] = Math.max(0, a.v - (mode === 'brut' ? 0 : taxe(e)));
  });
  gl().slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(g => {
    let need = g.target;
    const parts = [];
    (g.envs || []).forEach(id => {
      if (rem[id] == null) return;
      const take = Math.min(rem[id], need);
      rem[id] -= take;
      need -= take;
      parts.push({ id, amt: take });
    });
    out[g.id] = { funded: g.target - need, parts };
  });
  return out;
}

function vGoals() {
  const mode = S.gm === 'brut' ? 'brut' : 'net';
  const gs = gl().slice().sort((p, q) => p.date.localeCompare(q.date));
  const C = goalCalc(mode), Cb = goalCalc('brut'), Cn = goalCalc('net');
  const tot = gs.reduce((acc, g) => acc + g.target, 0);
  const fb = gs.reduce((acc, g) => acc + (Cb[g.id] ? Cb[g.id].funded : 0), 0);
  const fn = gs.reduce((acc, g) => acc + (Cn[g.id] ? Cn[g.id].funded : 0), 0);
  const fundedCurrent = mode === 'brut' ? fb : fn;
  const okCount = gs.filter(g => C[g.id] && isGoalDone(g, C[g.id])).length;
  const globalProgress = tot > 0 ? Math.min(100, (fundedCurrent / tot) * 100) : 0;

  const container = h('div', null);

  // Carte Héro Principale Objectifs
  container.append(
    h('div', { class: 'hero-banner' },
      h('div', { class: 'hero-title' }, getIcon('target', 15), 'Objectifs Patrimoniaux'),
      h('div', { class: 'hero-val num' }, gs.length ? `${okCount} / ${gs.length} atteints` : 'Aucun objectif'),
      h('div', { class: 'progress-track', style: 'margin: 8px 0 10px;' },
        h('div', { class: 'progress-fill', style: `width: ${globalProgress}%; background: var(--primary);` })
      ),
      h('div', { class: 'hero-pills' },
        h('span', { class: 'status-pill up' }, `Financé : ${E0.format(fundedCurrent)}`),
        h('span', { class: 'status-pill' }, `Total visé : ${E0.format(tot)}`),
        h('span', { class: 'status-pill', style: 'color: var(--down);' }, `Reste : ${E0.format(Math.max(0, tot - fundedCurrent))}`)
      )
    )
  );

  // Bascule Brut / Net et Bouton d'ajout
  container.append(
    h('div', { style: 'display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px;' },
      h('div', { class: 'chips-row' },
        h('button', { class: 'chip-btn', 'aria-pressed': String(mode === 'net'), onclick: () => { S.gm = 'net'; save(); render(); } }, 'Net d’impôts latents'),
        h('button', { class: 'chip-btn', 'aria-pressed': String(mode === 'brut'), onclick: () => { S.gm = 'brut'; save(); render(); } }, 'Brut')
      ),
      h('button', { class: 'btn btn-primary btn-sm', onclick: () => openGoalModal() },
        getIcon('plus', 14),
        'Nouvel objectif'
      )
    )
  );

  // Liste des objectifs
  container.append(
    h('div', { class: 'section-head' },
      h('div', { class: 'section-title' }, getIcon('target', 15), 'Mes Projets & Échéances'),
      gs.length ? h('span', { class: 'badge' }, `${gs.length} projet(s)`) : null
    )
  );

  const card = h('div', { class: 'card list' });
  gs.forEach(g => {
    const x = C[g.id] || { funded: 0, parts: [] };
    const pct = g.target > 0 ? Math.min(1, x.funded / g.target) : 0;
    const done = isGoalDone(g, x);
    const gd = new Date(g.date);
    const late = !done && gd < new Date();
    const ml = monthsLeft(gd);

    card.append(
      h('button', { class: 'row-item', onclick: () => go('#/g/' + g.id) },
        h('div', { class: 'row-left' },
          h('div', { class: 'row-avatar', style: done ? 'background: var(--up-light); color: var(--up);' : '' },
            done ? getIcon('check', 18) : getIcon('target', 18)
          ),
          h('div', { class: 'row-info' },
            h('div', { class: 'row-title' }, g.name),
            h('div', { class: `row-sub ${done ? 'up' : late ? 'down' : ''}` },
              done ? 'Objectif atteint ✓' : late ? 'Échéance dépassée' : `${fmtGoalDate(gd)} · dans ${ml} mois`
            ),
            h('div', { class: 'progress-track', style: 'height: 5px; margin-top: 6px;' },
              h('div', { class: 'progress-fill', style: `width: ${pct * 100}%; background: ${done ? 'var(--up)' : 'var(--primary)'};` })
            )
          )
        ),
        h('div', { class: 'row-right' },
          h('div', null,

          ),
          h('div', { class: 'chevron-icon' }, getIcon('chevron-right', 18))

        h('button', { class: 'btn btn-primary btn-sm', onclick: () => openGoalModal() }, getIcon('plus', 14), 'Créer mon premier objectif')
      )
    );
  }
  container.append(card);
  container.append(fireCard());

  return container;
}

function vGoal(id) {
  const g = gl().find(x => x.id === id);
  if (!g) return vGoals();

  const mode = S.gm || 'net';
  const x = goalCalc(mode)[id] || { funded: 0, parts: [] };
  const gd = new Date(g.date);
  const done = isGoalDone(g, x);
  const ml = monthsLeft(gd);
  const gap = Math.max(0, g.target - x.funded);
  const pl = plannedForGoal(g, gd);
  const rest = Math.max(0, gap - pl);
  const pct = g.target > 0 ? Math.min(100, (x.funded / g.target) * 100) : 0;

  const container = h('div', null,
    backButton('#/g', 'Objectifs'),
    h('div', { class: 'hero-banner' },
      h('div', { class: 'hero-title' }, getIcon('target', 15), `${g.type || 'Objectif'} · ${g.name}`),
      h('div', { class: `hero-val num ${done ? 'up' : ''}` }, done ? 'Objectif atteint ✓' : `${P0.format(pct / 100)} financé`),
      h('div', { class: 'progress-track', style: 'margin: 8px 0 10px;' },
        h('div', { class: 'progress-fill', style: `width: ${pct}%; background: ${done ? 'var(--up)' : 'var(--primary)'};` })
      ),
      h('div', { class: 'hero-pills' },
        h('span', { class: 'status-pill' }, `Financé : ${E0.format(x.funded)}`),
        h('span', { class: 'status-pill' }, `Cible : ${E0.format(g.target)}`),
        h('span', { class: 'status-pill' }, `Échéance : ${fmtGoalDate(gd)}${ml > 0 ? ` (${ml} mois)` : ''}`)
      )
    )
  );

  const gh = h('div', { class: 'card', style: 'padding: 14px; margin-top: 14px;' });
  gh.innerHTML = loanHouse({ pct: pct / 100 }, done ? 'objectif atteint' : 'de l’objectif financé');
  container.append(gh);

  // Carte de synthèse de l'effort d'épargne
  if (!done) {
    container.append(
      h('div', { class: 'card', style: 'padding: 16px 18px; margin-top: 14px; background: var(--surface-alt);' },
        h('div', { style: 'display: flex; justify-content: space-between; align-items: baseline;' },
          h('div', null,
            h('div', { style: 'font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase;' }, 'Effort d’épargne mensuel requis'),
            h('div', { class: 'hero-val num up', style: 'font-size: 24px; margin: 4px 0;' }, ml > 0 ? `${E0.format(rest / ml)} /mois` : 'Échéance atteinte')
          ),
          h('div', { class: 'badge', style: 'font-size: 13px;' }, `${E0.format(gap)} restant`)
        ),
        pl > 0 ? h('div', { style: 'font-size: 12.5px; color: var(--muted); margin-top: 4px;' },
          `Dont ${E0.format(pl)} déjà prévus par vos achats et provisions programmés dans l’onglet Stratégie.`
        ) : null
      )
    );
  }

  // Enveloppes affectées au financement
  container.append(
    h('div', { class: 'section-head' },
      h('div', { class: 'section-title' }, getIcon('briefcase', 15), 'Enveloppes qui financent ce projet')
    )
  );

  const envsCard = h('div', { class: 'card list' });
  (x.parts || []).forEach(p => {
    const e = S.envs.find(z => z.id === p.id);
    if (!e) return;
    const isShared = gl().filter(o => o.id !== id && (o.envs || []).includes(p.id)).length;
    envsCard.append(
      h('button', { class: 'row-item', onclick: () => go('#/e/' + e.id) },
        h('div', { class: 'row-left' },
          h('div', { class: 'row-avatar' }, getIcon(TYPES[e.type].icon || 'briefcase', 18)),
          h('div', { class: 'row-info' },
            h('div', { class: 'row-title' }, e.name),
            h('div', { class: 'row-sub' }, `${TYPES[e.type].c}${isShared ? ` · partagée avec ${isShared} autre(s) objectif(s)` : ''}`)
          )
        ),
        h('div', { class: 'row-right' },
          h('div', { class: 'row-val num' }, E0.format(p.amt)),
          h('div', { class: 'chevron-icon' }, getIcon('chevron-right', 18))
        )
      )
    );
  });

  if (!(x.parts || []).length) {
    envsCard.append(
      h('div', { class: 'empty-state', style: 'padding: 20px;' },
        h('span', null, 'Aucune enveloppe actuellement liée. Modifiez l’objectif ci-dessous pour sélectionner les comptes financeurs.')
      )
    );
  }
  container.append(envsCard);

  // Actions de modification / suppression
  container.append(
    h('div', { style: 'display: flex; gap: 10px; margin-top: 20px;' },
      h('button', { class: 'btn btn-secondary', style: 'flex: 1;', onclick: () => openGoalModal(g) },
        getIcon('edit', 15),
        'Modifier ce projet'
      ),
      h('button', { class: 'btn btn-danger', onclick: () => {
        openConfirmModal({
          title: `Supprimer « ${g.name} » ?`,
          message: 'Êtes-vous sûr de vouloir supprimer cet objectif ? Vos enveloppes ne seront pas impactées.',
          confirmText: 'Supprimer',
          confirmStyle: 'btn-danger',
          onConfirm: () => {
            S.goals = gl().filter(o => o.id !== id);
            save();
            toast('Objectif supprimé');
            go('#/g');
          }
        });
      } }, getIcon('trash', 15), 'Supprimer')
    )
  );

  return container;

function openGoalModal(g) {
  const root = $('#modal-root');
  const close = () => { root.innerHTML = ''; };

  if (!S.envs.length) {
    openAlertModal('Enveloppes requises', 'Ajoutez d’abord une enveloppe d’épargne ou d’investissement pour pouvoir financer un projet.');
    return;
  }

  const typeSel = h('select', null, ...GOAL_TYPES.map(t => h('option', { value: t, selected: g && g.type === t }, t)));
  const nameIn = h('input', { type: 'text', placeholder: 'ex. Apport immobilier ou Vacances Japon', value: g ? g.name : '' });
  const targetIn = h('input', { type: 'text', inputmode: 'decimal', placeholder: 'ex. 30000', value: g ? g.target : '' });
  const dateIn = h('input', { type: 'date', value: g ? g.date : new Date(Date.now() + 365 * 864e5 * 2).toISOString().slice(0, 10) });

  typeSel.onchange = () => {
    if (!nameIn.value.trim()) nameIn.value = typeSel.value;
  };

  const envCheckboxes = S.envs.map(e => {
    const chk = h('input', { type: 'checkbox', id: 'chk-g-' + e.id });
    chk.checked = g ? (g.envs || []).includes(e.id) : true;
    return { e, chk };
  });

  const modal = h('div', { class: 'modal-overlay', onclick: (ev) => { if (ev.target === modal) close(); } },
    h('div', { class: 'modal-sheet', style: 'max-width: 520px;' },
      h('div', { class: 'modal-header' },
        h('div', { class: 'modal-title' }, g ? `Modifier « ${g.name} »` : 'Nouvel Objectif de Vie'),
        h('button', { class: 'btn-icon-only', onclick: close }, getIcon('x', 16))
      ),
      h('div', { class: 'modal-body form-grid' },
        h('div', { class: 'form-group full-col' }, h('label', { class: 'form-label' }, 'Type de projet'), typeSel),
        h('div', { class: 'form-group full-col' }, h('label', { class: 'form-label' }, 'Intitulé'), nameIn),
        h('div', { class: 'form-group' }, h('label', { class: 'form-label' }, 'Montant visé (€)'), targetIn),
        h('div', { class: 'form-group' }, h('label', { class: 'form-label' }, 'Échéance prévue'), dateIn),
        h('div', { class: 'full-col', style: 'margin-top: 8px;' },
          h('div', { class: 'form-label', style: 'margin-bottom: 8px;' }, 'Enveloppes qui financent ce projet :'),
          h('div', { class: 'card list' },
            ...envCheckboxes.map(({ e, chk }) => h('label', { class: 'row-item', style: 'cursor: pointer;' },
              h('div', { class: 'row-left' },
                h('div', { class: 'row-avatar' }, getIcon(TYPES[e.type].icon || 'briefcase', 18)),
                h('div', { class: 'row-info' },
                  h('div', { class: 'row-title' }, e.name),
                  h('div', { class: 'row-sub' }, `${TYPES[e.type].c} · ${E0.format(agg(e.lines).v)}`)
                )
              ),
              chk
            ))
          )
        )
      ),
      h('div', { class: 'modal-footer' },
        h('button', { class: 'btn btn-secondary', onclick: close }, 'Annuler'),
        h('button', { class: 'btn btn-primary', onclick: () => {
          const nm = nameIn.value.trim() || typeSel.value;
          const tg = pf(targetIn.value);
          const dt = dateIn.value;
          const selectedEnvs = envCheckboxes.filter(c => c.chk.checked).map(c => c.e.id);

          if (!nm) { nameIn.focus(); return; }
          if (!(tg > 0)) { targetIn.focus(); return; }
          if (!dt) { dateIn.focus(); return; }
          if (!selectedEnvs.length) {
            openAlertModal('Sélection requise', 'Veuillez cocher au moins une enveloppe pour financer cet objectif.');
            return;
          }

          if (g) {
            g.name = nm;
            g.type = typeSel.value;
            g.target = tg;
            g.date = dt;
            g.envs = selectedEnvs;

function getBudget() {
  S.bud = S.bud || { rev: 0, step: null, groups: null, annualBills: [], last: null, inv: null };
  if (!S.bud.groups) {
    S.bud.groups = {};
    for (const gk in DEF_GROUPS) {
      S.bud.groups[gk] = {
        name: DEF_GROUPS[gk].name,
        color: DEF_GROUPS[gk].color,
        items: DEF_GROUPS[gk].items.map(name => ({ id: uid(), name, amt: 0 }))
      };
    }
  }
  // Migration : l'ancien groupe « Assurances et provisions mensualisées » est supprimé,
  // les montants déjà saisis sont conservés dans « Logement ».
  if (S.bud.groups.provisions) {
    const old = S.bud.groups.provisions;
    if (S.bud.groups.housing) {
      (old.items || []).filter(it => it.amt > 0).forEach(it => S.bud.groups.housing.items.push(it));
    }
    delete S.bud.groups.provisions;
    save();
  }
  // Migration : ajout de la catégorie « Abonnements » aux budgets déjà créés
  if (!S.bud.groups.subs) {
    S.bud.groups.subs = {
      name: DEF_GROUPS.subs.name,
      color: DEF_GROUPS.subs.color,
      items: DEF_GROUPS.subs.items.map(name => ({ id: uid(), name, amt: 0 }))
    };
    save();
  }
  S.bud.annualBills = S.bud.annualBills || [];
  S.bud.inv = S.bud.inv || { c0: null, pmt: null, r: 5, n: 20 };
  return S.bud;
}

function totalGroupSpend(grp) {
  return (grp.items || []).reduce((a, it) => a + (it.amt || 0), 0);
}

function allBudgetSpend(B) {
  let tot = 0;
  for (const gk in B.groups) {
    tot += totalGroupSpend(B.groups[gk]);
  }
  return tot;
}

const provMonthly = () => {
  const T = (S.st || {})[nowYear()];
  return T ? T.p.reduce((a, p) => a + p.amt, 0) : 0;
};

const perfNow = () => {
  const a = agg(allLines());
  return a.c ? (a.v + a.dv - a.c) / a.c * 100 : null;
};

// Diagramme de flux Sankey à 3 étages : Revenus → Catégories → Sous-catégories
function sankey(D) {
  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const rev = D.rev;
  const groups = D.groups.filter(g => g.amt > 0);
  const nLeaves = groups.reduce((a, g) => a + g.items.filter(i => i.amt > 0).length, 0);
  const W = 600, top = 40, nw = 12;
  const x0 = 8, x1 = 180, x2 = 360, gL = 6, gG = 14, minSlot = 16;
  const Hbase = Math.max(240, nLeaves * 30);
  const k = rev > 0 ? Hbase / rev : 1;

  const nodes = [];
  const leaves = [];
  let y2 = top;
  groups.forEach(g => {
    const node = { x: x1, y: y2, h: g.amt * k, col: g.col, name: g.name, amt: g.amt, outY: y2 };
    g.items.filter(i => i.amt > 0).forEach(it => {
      const lh = it.amt * k;
      leaves.push({ x: x2, y: y2, h: lh, col: g.col, name: it.name, amt: it.amt, from: node });
      y2 += Math.max(lh + gL, minSlot);
    });
    y2 += gG - gL;
    nodes.push(node);
  });
  if (D.free > 0) nodes.push({ x: x1, y: y2, h: D.free * k, col: 'var(--up)', name: 'Épargne libre', amt: D.free, outY: y2 });

  const links = [];
  let ry = top;
  nodes.forEach(n => {
    links.push({ sx: x0 + nw, tx: n.x, sy: ry, ty: n.y, h: n.h, col: n.col });
    ry += n.h;
  });
  leaves.forEach(l => {
    links.push({ sx: x1 + nw, tx: l.x, sy: l.from.outY, ty: l.y, h: l.h, col: l.col });
    l.from.outY += l.h;
  });

  let svgBody = '';
  links.forEach(l => {
    if (l.h <= 0) return;
    const mx = (l.sx + l.tx) / 2, sy = l.sy, ty = l.ty, h = l.h;
    svgBody += `<path d="M${l.sx},${sy.toFixed(1)} C${mx},${sy.toFixed(1)} ${mx},${ty.toFixed(1)} ${l.tx},${ty.toFixed(1)} L${l.tx},${(ty + h).toFixed(1)} C${mx},${(ty + h).toFixed(1)} ${mx},${(sy + h).toFixed(1)} ${l.sx},${(sy + h).toFixed(1)} Z" fill="${l.col}" opacity="0.32"/>`;
  });

  let bottom = top + Hbase;
  const rect = (x, y, h, col) => `<rect x="${x}" y="${y.toFixed(1)}" width="${nw}" height="${Math.max(h, 1.5).toFixed(1)}" rx="3" fill="${col}"/>`;
  svgBody += rect(x0, top, rev * k, 'var(--ink)');
  nodes.forEach(n => { svgBody += rect(n.x, n.y, n.h, n.col); bottom = Math.max(bottom, n.y + n.h); });
  leaves.forEach(l => { svgBody += rect(l.x, l.y, l.h, l.col); bottom = Math.max(bottom, l.y + l.h); });

  svgBody += `<text x="${x0}" y="18" font-size="12" font-weight="700" style="fill:var(--ink)">Revenus ${esc(E0.format(rev))}</text>`;

  let lastCy = -1e9;
  nodes.forEach(n => {
    const cy = Math.max(n.y + n.h / 2, lastCy + 36, top + 16);
    lastCy = cy;
    const w = Math.max(n.name.length, E0.format(n.amt).length) * 6.2 + 18;
    svgBody += `<rect x="${(x1 + nw + 8)}" y="${(cy - 16).toFixed(1)}" width="${w.toFixed(1)}" height="32" rx="10" style="fill:var(--surface);stroke:var(--border)"/>
      <text x="${(x1 + nw + 17)}" y="${(cy - 2).toFixed(1)}" font-size="11" font-weight="700" style="fill:var(--ink)">${esc(n.name)}</text>
      <text x="${(x1 + nw + 17)}" y="${(cy + 10).toFixed(1)}" font-size="11" style="fill:var(--muted)">${esc(E0.format(n.amt))}</text>`;
    bottom = Math.max(bottom, cy + 18);
  });

  let ll = -1e9;
  leaves.forEach(l => {
    const cy = Math.max(l.y + l.h / 2 + 4, ll + 14); ll = cy;
    svgBody += `<text x="${(x2 + nw + 6)}" y="${cy.toFixed(1)}" font-size="11" style="fill:var(--ink)"><tspan font-weight="600">${esc(l.name)}</tspan><tspan dx="6" style="fill:var(--muted)">${esc(E0.format(l.amt))}</tspan></text>`;
    bottom = Math.max(bottom, cy + 6);
  });

  const H = bottom + 16;
  const w = h('div', { style: 'width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; padding-bottom: 6px;' });
  w.innerHTML = `<svg viewBox="0 0 ${W} ${H.toFixed(0)}" style="min-width: 540px; width: 100%; height: auto; display: block;" role="img" aria-label="Diagramme Sankey du budget">${svgBody}</svg>`;
  return w;
}

// Courbe des intérêts composés
function compoundCard() {
  const B = getBudget(), I = B.inv;
  const lr = Math.max(0, (B.rev - allBudgetSpend(B)) - provMonthly());
  const c0I = h('input', { type: 'text', inputmode: 'decimal', value: I.c0 != null ? I.c0 : Math.round(agg(allLines()).v) });
  const pI = h('input', { type: 'text', inputmode: 'decimal', value: I.pmt != null ? I.pmt : Math.round(lr) });
  const rI = h('input', { type: 'text', inputmode: 'decimal', value: I.r });
  const nI = h('input', { type: 'text', inputmode: 'numeric', pattern: '[0-9]*', value: I.n });
  const out = h('div');

  const upd = () => {
    I.c0 = Math.max(0, pf(c0I.value) || 0);
    I.pmt = Math.max(0, pf(pI.value) || 0);
    I.r = pf(rI.value) || 0;
    I.n = Math.min(60, Math.max(1, parseInt(nI.value, 10) || I.n));
    save();
    out.replaceChildren(...compoundOut(I));
  };

  [c0I, pI, rI, nI].forEach(x => { x.oninput = upd; });
  const perf = perfNow();

  const container = h('div', { style: 'margin-top: 24px;' },
    h('div', { class: 'section-head' },
      h('div', { class: 'section-title' }, getIcon('trending-up', 15), 'Simulateur d’Intérêts Composés')
    )
  );

  if (perf != null) {
    container.append(
      h('div', { class: 'card', style: 'padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px;' },
        h('div', null,
          h('div', { style: 'font-size: 12px; color: var(--muted);' }, 'Performance réelle actuelle de votre portefeuille :'),
          h('div', { class: `num ${cls(perf)}`, style: 'font-size: 18px; font-weight: 800;' }, `${perf >= 0 ? '+' : ''}${fr1(perf)} %`)
        ),
        h('button', { class: 'btn btn-secondary btn-sm', onclick: () => { rI.value = +perf.toFixed(2); upd(); } }, 'Utiliser ce rendement')
      )
    );
  }

  container.append(
    h('div', { class: 'card form-grid' },
      h('div', { class: 'form-group' }, h('label', { class: 'form-label' }, 'Capital initial (€)'), c0I),
      h('div', { class: 'form-group' }, h('label', { class: 'form-label' }, 'Versement mensuel (€)'), pI),
      h('div', { class: 'form-group' }, h('label', { class: 'form-label' }, 'Rendement annuel moyen (%)'), rI),
      h('div', { class: 'form-group' }, h('label', { class: 'form-label' }, 'Horizon (années)'), nI)
    ),
    out
  );

  upd();
  return container;
}

function compoundOut(I) {
  const mr = I.r / 100 / 12, N = I.n * 12, W = 340, H = 140;
  const withV = [I.c0], noV = [I.c0], vers = [I.c0];
  let w = I.c0, z = I.c0;
  for (let y = 1; y <= I.n; y++) {
    for (let k = 0; k < 12; k++) {
      w = w * (1 + mr) + I.pmt;
      z = z * (1 + mr);
    }
    withV.push(w);
    noV.push(z);
    vers.push(I.c0 + I.pmt * 12 * y);
  }
  const verse = I.c0 + I.pmt * N, gains = w - verse;
  const mx = Math.max(...withV, I.c0) || 1;
  const X = i => (i / I.n * W).toFixed(1), Y = q => (H - q / mx * H).toFixed(1);
  const pts = arr => arr.map((q, i) => X(i) + ',' + Y(q)).join(' ');
  const area = pts(withV) + ' ' + vers.map((q, i) => [i, q]).reverse().map(([i, q]) => X(i) + ',' + Y(q)).join(' ');

  const svg = h('div', { style: 'margin: 14px 0;' });
  svg.innerHTML = `
    <svg viewBox="0 0 ${W} ${H + 24}" width="100%" role="img" aria-label="Intérêts composés" style="display:block; overflow:visible;">
      <polygon points="${area}" fill="var(--up)" opacity="0.22"/>
      <line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--border)" stroke-width="1"/>
      <polyline fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4" points="${pts(noV)}"/>
      <polyline fill="none" stroke="var(--primary)" stroke-width="2.5" points="${pts(withV)}"/>
      <text x="0" y="${H + 18}" font-size="11" font-weight="600" fill="var(--muted)">Aujourd’hui</text>
      <text x="${W}" y="${H + 18}" text-anchor="end" font-size="11" font-weight="600" fill="var(--muted)">Dans ${I.n} ans</text>
    </svg>
  `;

  return [
    h('div', { class: 'card', style: 'padding: 16px 20px; margin-top: 12px;' },
      h('div', { style: 'font-size: 13px; color: var(--muted);' }, `Dans ${I.n} ans, vos intérêts cumulés généreront :`),
      h('div', { class: 'hero-val num up', style: 'font-size: 26px; margin: 4px 0 10px;' }, `+ ${E0.format(Math.max(0, gains))}`),
      svg,
      h('div', { class: 'list', style: 'border-top: 1px solid var(--border); padding-top: 8px;' },
        h('div', { style: 'display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px;' },
          h('span', { style: 'color: var(--ink); font-weight: 700;' }, 'Capital final projeté'),
          h('span', { class: 'num up', style: 'font-weight: 800; font-size: 15px;' }, E0.format(w))
        ),
        h('div', { style: 'display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px;' },
          h('span', { style: 'color: var(--muted);' }, 'Total de votre apport (départ + versements)'),
          h('span', { class: 'num', style: 'font-weight: 600;' }, E0.format(verse))
        ),
        h('div', { style: 'display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px;' },
          h('span', { style: 'color: var(--up); font-weight: 600;' }, 'Gains purs d’intérêts'),
          h('span', { class: 'num up', style: 'font-weight: 700;' }, E0.format(Math.max(0, gains)))
        ),
        h('div', { style: 'display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px;' },
          h('span', { style: 'color: var(--muted);' }, 'Sans nouveaux versements (capital seul)'),
          h('span', { class: 'num', style: 'font-weight: 600;' }, E0.format(z))
        )
      )
    )
  ];
}

function openScriptGuideModal(onBack) {
  if (typeof onBack !== 'function') onBack = null;
  const root = $('#modal-root');
  const close = () => { root.innerHTML = ''; if (onBack) onBack(); };

  const scriptCode = `/**
 * Relais de cotations – version 3 (Google Apps Script) : ajoute la recherche par ISIN
 * Déploiement : Apps Script > Déployer > Nouveau déploiement > Application Web
 *   Exécuter en tant que : Moi / Qui a accès : Tout le monde
 */
const OPTS = { headers: { 'User-Agent': 'Mozilla/5.0' }, muteHttpExceptions: true };
const CACHE_SECONDS = 120;
const PREFERRED = ['PAR', 'AMS', 'GER', 'FRA', 'MIL', 'MCE', 'BRU', 'LIS', 'EBS', 'LSE', 'NMS', 'NYQ', 'NGM'];
const TYPES = { EQUITY: 'Action', ETF: 'ETF', CRYPTOCURRENCY: 'Crypto', MUTUALFUND: 'Fonds', INDEX: 'Indice' };

function doGet(e) {
  const p = e.parameter || {};
  let out;
  try {
    out = p.action === 'ping' ? { ok: true, version: VERSION }
      : p.action === 'isin' ? isin_(p.isin || '')
      : p.action === 'search' ? search_(p.q || '')
      : p.action === 'inflation' ? inflation_()
      : quotes_((p.symbols || '').split(',').map(s => s.trim()).filter(Boolean).slice(0, 40));
  } catch (err) {
    out = { error: String(err) };
  }
  return ContentService.createTextOutput(JSON.stringify(out))
    .setMimeType(ContentService.MimeType.JSON);
}

// Vérifie un ISIN : 2 lettres, 9 caractères, 1 chiffre + clé de contrôle (Luhn)
function isinOk_(s) {
  if (!/^[A-Z]{2}[A-Z0-9]{9}[0-9]$/.test(s)) return false;
  let digits = '';
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    digits += c >= 65 ? String(c - 55) : s.charAt(i);
  }
  let sum = 0, dbl = false;
  for (let i = digits.length - 1; i >= 0; i--) {
    let d = digits.charCodeAt(i) - 48;
    if (dbl) { d *= 2; if (d > 9) d -= 9; }
    sum += d;
    dbl = !dbl;
  }
  return sum % 10 === 0;
}

// Toutes les cotations d'un ISIN (place, devise, cours) pour choisir la bonne
function isin_(isin) {
  isin = String(isin || '').trim().toUpperCase();
  if (!isinOk_(isin)) return { error: 'ISIN invalide' };
  const cache = CacheService.getScriptCache();
  const key = 'i3:' + isin;
  const hit = cache.get(key);
  if (hit) return JSON.parse(hit);

  const found = (yahooSearch_(isin, 20).quotes || []).filter(x => x.symbol && TYPES[x.quoteType]);
  const seen = {};
  const syms = [];
  found.forEach(x => { if (!seen[x.symbol]) { seen[x.symbol] = x; syms.push(x.symbol); } });
  const top = syms.slice(0, 8);
  const reqs = top.map(s => Object.assign(
    { url: 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(s) + '?interval=1d&range=1d' },
    OPTS
  ));
  const list = [];
  UrlFetchApp.fetchAll(reqs).forEach((r, i) => {
    try {
      const m = JSON.parse(r.getContentText()).chart.result[0].meta;
      const x = seen[top[i]];
      const rk = PREFERRED.indexOf(x.exchange);
      list.push({
        symbol: top[i],
        name: m.shortName || m.longName || x.shortname || x.longname || top[i],
        exchange: m.fullExchangeName || x.exchDisp || m.exchangeName || '',
        currency: m.currency,
        price: m.regularMarketPrice,
        type: TYPES[x.quoteType],
        rank: rk >= 0 ? rk : 99
      });
    } catch (err) { }
  });
  list.sort((a, b) => a.rank - b.rank);
  const out = {
    isin: isin,
    listings: list.map(l => ({ symbol: l.symbol, name: l.name, exchange: l.exchange, currency: l.currency, price: l.price, type: l.type }))
  };
  if (list.length) cache.put(key, JSON.stringify(out), 21600);
  return out;
}

function yahooSearch_(q, count) {
  const tries = [
    'https://query2.finance.yahoo.com/v1/finance/search?quotesCount=' + count + '&newsCount=0&lang=fr-FR&region=FR&q=',
    'https://query2.finance.yahoo.com/v1/finance/search?quotesCount=' + count + '&newsCount=0&q=',
    'https://query1.finance.yahoo.com/v1/finance/search?quotesCount=' + count + '&newsCount=0&q='
  ];
  let last = 'aucune réponse';
  for (let i = 0; i < tries.length; i++) {
    const r = UrlFetchApp.fetch(tries[i] + encodeURIComponent(q), OPTS);
    if (r.getResponseCode() === 200) {
      try { return JSON.parse(r.getContentText()); } catch (err) { last = 'réponse illisible de Yahoo'; }
    } else {
      last = 'Yahoo a répondu ' + r.getResponseCode();
    }
  }
  throw new Error(last);
}

function rank_(j, ql) {
  return (j.quotes || [])
    .filter(x => x.symbol && TYPES[x.quoteType])
    .map((x, idx) => {
      const name = x.shortname || x.longname || x.symbol;
      let score = 0;
      if (name.toLowerCase().indexOf(ql) === 0 || x.symbol.toLowerCase() === ql) score -= 3;
      if (name.toLowerCase().indexOf(ql) >= 0) score -= 1;
      if (PREFERRED.indexOf(x.exchange) >= 0) score -= 2;
      if (x.quoteType === 'CRYPTOCURRENCY') score += x.symbol.slice(-4) === '-EUR' ? -2 : (x.symbol.slice(-4) === '-USD' ? -1 : 0);
      return { symbol: x.symbol, name: name, exchange: x.exchDisp || x.exchange || '', type: TYPES[x.quoteType], score: score, idx: idx };
    });
}

function search_(q) {
  q = q.trim();
  if (!q) return { results: [] };
  const cache = CacheService.getScriptCache();
  const key = 's2:' + q.toLowerCase().slice(0, 80);
  const hit = cache.get(key);
  if (hit) return JSON.parse(hit);

  const ql = q.toLowerCase();
  let list = rank_(yahooSearch_(q, 30), ql);
  if (list.length < 5) {
    try {
      const seen = {};
      list.forEach(x => { seen[x.symbol] = 1; });
      rank_(yahooSearch_(q + ' stock', 30), ql).forEach(x => {
        if (!seen[x.symbol]) { seen[x.symbol] = 1; list.push(x); }
      });
    } catch (err) { }
  }
  list = list.sort((a, b) => a.score - b.score || a.idx - b.idx).slice(0, 12)
    .map(r => ({ symbol: r.symbol, name: r.name, exchange: r.exchange, type: r.type }));

  const out = { results: list };
  if (list.length) cache.put(key, JSON.stringify(out), 21600);
  return out;
}

function inflation_() {
  const cache = CacheService.getScriptCache();
  const hit = cache.get('infl');
  if (hit) return JSON.parse(hit);
  const url = 'https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_hicp_manr?format=JSON&lang=FR&geo=FR&coicop=CP00&unit=RCH_A';
  const j = JSON.parse(UrlFetchApp.fetch(url, OPTS).getContentText());
  const idx = j.dimension.time.category.index;
  const vals = j.value;
  const pairs = Array.isArray(idx)
    ? idx.map((t, i) => [t, i])
    : Object.keys(idx).map(t => [t, idx[t]]);
  let best = null;
  pairs.forEach(([t, i]) => {
    const v = vals[i];
    if (v != null && (!best || t > best.period)) best = { period: t, rate: v };
  });
  if (!best) throw new Error('inflation indisponible');
  cache.put('infl', JSON.stringify(best), 21600);
  return best;
}

      searchResults.replaceChildren(isinLookupUI(qi, r => showAddQuoteForm({ ...r, isin: qi }, envSel.value), () => { close(); openRelayModal(); }));
      return;
    }
    const local = ETF_CAT.filter(r => (r.name + r.symbol + r.isin + r.kw).toLowerCase().replace(/[\s-]+/g, '').includes(ql));
    const head = local.length ? [lab('Dans ma liste'), ...local.map(popRow)] : [];
    if (!S.url) {
      searchResults.replaceChildren(...head,
        h('div', { class: 'card', style: 'padding: 14px; text-align: center; border: 1px dashed var(--primary); margin-top: 10px;' },
          h('div', { style: 'font-size: 13px; color: var(--ink);' }, 'Le relais Google Apps Script n’est pas configuré : la recherche en ligne est indisponible.'),
          h('button', { class: 'btn btn-primary btn-sm', style: 'margin-top: 8px;', onclick: () => { close(); openRelayModal(); } }, 'Connecter le relais')
        )
      );
      return;
    }
    searchResults.replaceChildren(...head, note('Recherche sur Yahoo Finance...'));
    searchTimeout = setTimeout(async () => {
      try {
        const { results } = await api({ action: 'search', q });
        const rem = (results || []).filter(r => !local.some(z => z.symbol === r.symbol));
        searchResults.replaceChildren(...head,
          ...(rem.length ? [lab('Résultats en ligne'), ...rem.map(popRow)] : (local.length ? [] : [note('Aucun résultat. Essayez le nom du fonds (ex. « MSCI World »), son ticker ou son ISIN. Pas de cotation ? Utilisez la saisie manuelle.')])));
      } catch (e) {
        searchResults.replaceChildren(...head, h('div', { style: 'padding: 12px; font-size: 13px; color: var(--down);' }, 'Erreur de recherche.'));
      }
    }, 200);
  };

  const showAddQuoteForm = (r, envId) => {
    const qty = h('input', { type: 'text', inputmode: 'decimal', placeholder: 'ex. 10' });
    const cost = h('input', { type: 'text', inputmode: 'decimal', placeholder: 'ex. 450.50' });
    const feeIn = h('input', { type: 'text', inputmode: 'decimal', placeholder: r.type === 'ETF' ? 'ex. 0.20' : '0 (action)', value: r.type === 'ETF' ? '0.20' : '' });
    const isinIn = h('input', { type: 'text', placeholder: 'ex. LU1681043599 (optionnel)', value: r.isin || '', maxlength: '12', style: 'text-transform: uppercase;' });

    searchResults.replaceChildren(
      h('div', { class: 'card form-grid', style: 'margin-top: 8px;' },
        h('div', { class: 'full-col' },
          h('div', { style: 'font-weight: 700; color: var(--ink);' }, r.name),
          h('div', { style: 'font-size: 12px; color: var(--muted);' }, `${r.symbol} · ${r.exchange} (${r.type})`)
        ),
        h('div', { class: 'form-group' }, h('label', { class: 'form-label' }, 'Nombre de parts'), qty),
        h('div', { class: 'form-group' }, h('label', { class: 'form-label' }, 'Prix d’achat moyen (PRU €)'), cost),
        ['ETF', 'Fonds'].includes(r.type) ? h('div', { class: 'form-group full-col' },
          h('label', { class: 'form-label' }, 'Frais de gestion annuels du titre (%/an)', h('span', { class: 'opt' }, r.type === 'ETF' ? ' (Frais ETF)' : '')),
          feeIn
        ) : null,
        h('div', { class: 'form-group full-col' }, h('label', { class: 'form-label' }, 'ISIN', h('span', { class: 'opt' }, ' (optionnel, pour garder une trace)')), isinIn),
        h('div', { class: 'full-col', style: 'display: flex; gap: 8px;' },
          h('button', { class: 'btn btn-primary', onclick: () => {
            const n = pf(qty.value), c = pf(cost.value), f = pf(feeIn.value);
            if (!(n > 0)) { qty.focus(); return; }
            if (!(c >= 0)) { cost.focus(); return; }
            const e = S.envs.find(x => x.id === envId);
            if (!e) return;
            e.lines.push({
              id: uid(),
              m: 1,
              sym: r.symbol,
              name: r.name,
              qty: n,
              cost: c,
              divs: [],
              kind: r.type,
              fee: !isNaN(f) && f >= 0 ? f : undefined,
              ordFee: 0,
              isin: /^[A-Z]{2}[A-Z0-9]{9}[0-9]$/.test(isinIn.value.trim().toUpperCase()) ? isinIn.value.trim().toUpperCase() : undefined
            });
            save();
            close();

            refreshQuotes();

          h('button', { class: 'btn btn-secondary', onclick: () => searchResults.replaceChildren() }, 'Annuler')
        )

    qty.focus();
  };

  root.replaceChildren(modal);

  showPopular();
  updateModal();
}

function openExecuteBuyModal(b) {
  const root = $('#modal-root');
  const close = () => { root.innerHTML = ''; };

  const qtyIn = h('input', { type: 'text', inputmode: 'decimal', placeholder: 'Calcul...' });
  const priceIn = h('input', { type: 'text', inputmode: 'decimal', placeholder: 'Prix payé' });
  const ordIn = h('input', { type: 'text', inputmode: 'decimal', value: '0' });

  const modal = h('div', { class: 'modal-overlay', onclick: (ev) => { if (ev.target === modal) close(); } },
    h('div', { class: 'modal-sheet', style: 'max-width: 480px;' },
      h('div', { class: 'modal-header' },
        h('div', { class: 'modal-title' }, `Exécuter l’ordre : ${b.name}`),
        h('button', { class: 'btn-icon-only', onclick: close }, getIcon('x', 16))
      ),
      h('div', { class: 'modal-body form-grid' },
        h('div', { class: 'full-col', style: 'font-size: 13px; color: var(--muted);' },
          `Budget prévu : ${E0.format(b.amt)}. Indiquez le cours d’achat effectif pour ajouter automatiquement les parts à votre enveloppe.`
        ),
        h('div', { class: 'form-group' }, h('label', { class: 'form-label' }, 'Prix d’exécution (€)'), priceIn),
        h('div', { class: 'form-group' }, h('label', { class: 'form-label' }, 'Nombre de parts'), qtyIn),
        h('div', { class: 'form-group full-col' }, h('label', { class: 'form-label' }, 'Frais d’ordre / courtage (€)'), ordIn)
      ),
      h('div', { class: 'modal-footer' },
        h('button', { class: 'btn btn-secondary', onclick: close }, 'Annuler'),
        h('button', { class: 'btn btn-primary', onclick: () => {
          const p = pf(priceIn.value), q = pf(qtyIn.value), o = pf(ordIn.value) || 0;
          if (!(p > 0) || !(q > 0)) { priceIn.focus(); return; }
          applyBuy(b, q, p, o);
          close();
        } }, 'Valider l’achat')
      )
    )
  );

  root.replaceChildren(modal);

  (async () => {
    try {
      const q = await quote(b.sym);
      if (q && q.p) {
        const estPrice = +(q.p * q.fx).toFixed(4);
        priceIn.value = estPrice;
        qtyIn.value = +(b.amt / estPrice).toFixed(4);
      }
    } catch(e) {}
  })();

  priceIn.oninput = () => {
    const p = pf(priceIn.value);
    if (p > 0) qtyIn.value = +(b.amt / p).toFixed(4);
  };
}

function applyBuy(b, qty, price, ord) {
  const e = S.envs.find(x => x.id === b.env);
  if (!e) return;
  const l = e.lines.find(x => x.m && x.sym === b.sym);
  if (l) {
    const nq = l.qty + qty;
    l.cost = (l.cost * l.qty + price * qty) / nq;
    l.qty = nq;
    l.ordFee = (l.ordFee || 0) + ord;
  } else {
    e.lines.push({ id: uid(), m: 1, sym: b.sym, name: b.name, qty, cost: price, divs: [], kind: b.kind || 'ETF', ordFee: ord });
  }
  b.done = { t: Date.now(), q: qty, p: price, e: qty * price, o: ord };
  save();
  toast(`Ordre exécuté : ${N.format(qty)} parts de ${b.name}`);
  render();
  refreshQuotes();
}

async function quote(sym) {
  if (!S.url) throw new Error('Relais non configuré');
  const a = await api({ symbols: sym }), q = a.quotes[sym];
  if (!q || q.error || q.price == null) throw new Error('Cours indisponible');
  const n = norm(q);
  let fxr = 1;
  if (n.currency !== 'EUR') {
    const b = await api({ symbols: n.currency + 'EUR=X' }), x = b.quotes[n.currency + 'EUR=X'];
    if (x && x.price) fxr = x.price;
  }
  return { p: n.price, c: n.currency, fx: fxr };
}

function wzFlow() {
  const f = ['welcome', 'melt', 'why', 'how', 'p-intro', 'p-pick'];
  S.envs.forEach(e => f.push('p-env:' + e.id));
  f.push('p-debts', 'p-sum', 'c-intro');
  S.envs.filter(e => TYPES[e.type] && !TYPES[e.type].nc).forEach(e => f.push('c-fees:' + e.id));
  f.push('c-rev');
  Object.keys(getBudget().groups).forEach(k => f.push('c-grp:' + k));
  f.push('c-annual', 'c-sum', 'g-intro', 'g-goals', 's-intro', 's-plan', 'end');

const wzChapter = id => ({ p: 0, c: 1, g: 2, s: 3 })[id.split('-')[0]] ?? -1;

  svg.prepend(defs, el('path', { class: 'wz-snow-back', d: `M150 ${H} L232 70 L262 92 L290 58 L340 112 L340 ${H} Z` }), flakes, el('path', { d: hill, fill: `url(#${uidp}h)` }), el('path', { d: edge, class: 'wz-snow-edge' }), marks, trail, shade, ghost, bits, ball);

  // Légende chiffrée sous l'animation
  const yr = el('text', { class: 'wz-snow-yr', x: W - 4, y: 40, 'text-anchor': 'end' }); yr.textContent = 'Mois 1';
  if (!o.still) svg.append(yr);
  const paidEl = h('strong', null, '100 €'), capEl = h('strong', { class: 'wz-snow-amt' }, '100 €');
  const plannedEl = h('strong', null, '');
  const cap = o.still ? null : h('div', { class: 'wz-snow-cap' },
    h('div', { class: 'wz-snow-figs' },
      h('div', null, h('span', null, 'Versé'), paidEl),
      mode === 'melt' ? h('div', { class: 'ghost' }, h('span', null, 'Prévu'), plannedEl) : null,
      h('div', { class: 'main' }, h('span', null, mode === 'melt' ? 'Il reste' : 'Capital'), capEl)),
    h('div', { class: 'wz-snow-note' }, mode === 'melt'
      ? 'Mêmes 100 €/mois à 4 %, en euros d’aujourd’hui (hypothèses).'
      : 'Exemple : 100 €/mois à 4 % par an (hypothèse, non garantie).'));
  const list = mode === 'melt' && !o.still ? h('ol', { class: 'wz-melt-list' }, ...evs.map((e, j) => {
    const li = h('li', null, h('span', { class: 'wz-melt-n' }, String(j + 1)), h('span', null, h('strong', null, e.t), h('span', null, e.d)));
    e.li = li; return li;
  })) : null;
  const wrap = h('div', { class: 'wz-snow' + (o.still ? ' still' : '') + (mode === 'melt' ? ' melt' : '') }, svg, cap, list);

  // Morceaux qui se détachent, gouttes qui fondent
  let parts = [];
  const burst = (cx, cy, r, n, drip) => {
    for (let k = 0; k < n; k++) {
      const a = drip ? Math.PI / 2 + (Math.random() - .5) * .6 : -Math.PI * (0.15 + Math.random() * 0.7) - (Math.random() < .5 ? 0 : Math.PI * 0.1);
      const sp = drip ? 0.4 : 0.8 + Math.random() * 1.4, c = el('circle', { class: drip ? 'drop' : 'chunk', r: drip ? 1.1 : 0.8 + Math.random() * 1.8 });
      bits.append(c);
      parts.push({ c, x: cx + Math.cos(a) * r * .8, y: cy + Math.sin(a) * r * .8, vx: drip ? -0.3 : Math.cos(a) * sp - 0.6, vy: Math.sin(a) * sp, life: 1 });
    }
  };
  const stepParts = () => {
    parts = parts.filter(p => {
      p.vy += 0.06; p.x += p.vx; p.y += p.vy; p.life -= 0.022;
      if (p.life <= 0) { p.c.remove(); return false; }
      p.c.setAttribute('cx', p.x.toFixed(1)); p.c.setAttribute('cy', p.y.toFixed(1)); p.c.setAttribute('opacity', p.life.toFixed(2));
      return true;
    });
  };

  let ang = 0, px = X0, py = f(X0), lastDrip = 0;
  const reset = () => { ang = 0; px = X0; py = f(X0); parts.forEach(p => p.c.remove()); parts = []; evs.forEach(e => { e.done = false; e.g.classList.remove('hit'); if (e.li) e.li.classList.remove('on'); }); };
  const draw = (t, now) => {
    const n = Math.min(360, Math.max(0, Math.round(t * 360))), row = Mx[n];
    const x = xAt(t), y = f(x), s = df(x), L = Math.hypot(1, s);
    const r = mode === 'melt' ? rOf(row.real) : rOf(G[n].v);
    const cx = x + s * r / L, cy = y - r / L;
    ang += Math.hypot(x - px, y - py) / Math.max(r, 1) * 57.3; px = x; py = y;
    body.setAttribute('r', r.toFixed(2));
    ball.setAttribute('transform', `translate(${cx.toFixed(2)} ${cy.toFixed(2)})`);
    spin.setAttribute('transform', `rotate(${ang.toFixed(1)}) scale(${r.toFixed(2)})`);
    shade.setAttribute('cx', x.toFixed(1)); shade.setAttribute('cy', (y + 1.5).toFixed(1));
    shade.setAttribute('rx', (r * 0.9).toFixed(1)); shade.setAttribute('ry', (r * 0.16).toFixed(1));
    if (mode === 'melt') {
      const gr = rOf(G[n].v);
      ghost.setAttribute('r', gr.toFixed(2));
      ghost.setAttribute('cx', (x + s * gr / L).toFixed(2)); ghost.setAttribute('cy', (y - gr / L).toFixed(2));
      evs.forEach(e => {
        if (!e.done && n >= e.m) {
          e.done = true; e.g.classList.add('hit'); if (e.li) e.li.classList.add('on');
          if (now != null) burst(cx, cy, r, e.k === 'infl' ? 4 : 9, e.k === 'infl');
        }
      });
      if (now != null && n > 168 && now - lastDrip > 260) { lastDrip = now; burst(cx, cy + r * 0.6, r, 1, true); }
    }
    let d = `M${X0} ${f(X0).toFixed(1)}`;
    for (let xx = X0 + 3; xx < x; xx += 3) d += ` L${xx} ${f(xx).toFixed(1)}`;
    trail.setAttribute('d', d + ` L${x.toFixed(1)} ${y.toFixed(1)}`);
    if (cap) {
      const nn = Math.max(1, n);
      yr.textContent = nn < 12 ? `Mois ${nn}` : `Année ${Math.floor(nn / 12)}`;
      paidEl.textContent = E0.format(Mx[nn].paid);
      capEl.textContent = E0.format(mode === 'melt' ? Mx[nn].real : Mx[nn].v);
      plannedEl.textContent = E0.format(G[nn].v);
    }
  };
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (o.still || reduce) { draw(1, null); return wrap; }
  const DUR = mode === 'melt' ? 7600 : 5200, HOLD = mode === 'melt' ? 3200 : 2200;
  let t0 = null;
  const tick = now => {
    if (!wrap.isConnected && t0 !== null) return;
    if (wrap.isConnected) {
      if (t0 === null) t0 = now;
      const e = now - t0;
      if (e <= DUR) { wrap.classList.remove('fade'); draw(e / DUR, now); }
      else if (e > DUR + HOLD) { t0 = now; reset(); }
      else if (e > DUR + HOLD - 500) wrap.classList.add('fade');
      stepParts();
    }
    requestAnimationFrame(tick);
  };
  draw(0, null);
  requestAnimationFrame(tick);
  return wrap;
}

// Une enveloppe « simple » = au plus une ligne manuelle : on la pilote par un seul grand montant
const wzSimple = e => e.lines.length === 0 || (e.lines.length === 1 && !e.lines[0].m);
function wzTotalLine(e, n, label) {
  let l = e.lines[0];
  if (n == null) { if (l && !l.m && !l.loan) e.lines = []; else if (l && !l.m) { l.val = 0; } }
  else if (l && !l.m) { const same = l.cst === l.val; l.val = n; if (same || l.cst == null) l.cst = n; }
  else e.lines.push({ id: uid(), name: label, val: n, cst: n, divs: [] });
  wzSave();
}

    }

    // Vue d'ensemble : calendrier de l'année + lignes du plan
    const y = P.y, T = getStrategy(y), firstM = y === y0 ? m0 : 0;
    const monthTot = m => T.b.filter(b => b.m === m).reduce((t, b) => t + (b.done && b.done.e != null ? b.done.e : b.amt), 0) + T.p.filter(p => m >= (p.f || 0)).reduce((t, p) => t + p.amt, 0);
    const tots = MONTH_NAMES.map((_, m) => monthTot(m));
    const maxT = Math.max(base, ...tots, 1);
    const over = tots.map((t, m) => m >= firstM && base > 0 && t > base + 0.5);
    const series = {};
    T.b.filter(b => !b.done).forEach(b => { const k = [b.name, b.env, b.amt].join('|'); (series[k] = series[k] || []).push(b); });
    const serList = Object.values(series);
    const envName = id => (S.envs.find(e => e.id === id) || { name: '?' }).name;
    const avg = (() => { const ms = tots.slice(firstM); return ms.length ? ms.reduce((a, b) => a + b, 0) / ms.length : 0; })();
    return {
      title: 'Votre plan mensuel',
      body: [
        wzChips([y0, y0 + 1].map(v => [String(v), v === y, () => { P.y = v; wzDraw(false); }])),
        h('div', { class: 'wz-cal', role: 'list', 'aria-label': `Calendrier ${y}` }, ...MONTH_NAMES.map((mn, m) => h('div', { class: 'wz-cal-m' + (m < firstM ? ' past' : '') + (over[m] ? ' over' : ''), role: 'listitem', 'aria-label': `${mn} : ${E0.format(tots[m])}` },
          h('div', { class: 'wz-cal-b' }, h('i', { style: `height: ${Math.max(tots[m] ? 6 : 0, Math.round(tots[m] / maxT * 100))}%;` }), base > 0 ? h('u', { style: `bottom: ${Math.round(base / maxT * 100)}%;` }) : null),
          h('div', { class: 'wz-cal-n' }, mn.slice(0, 1))))),
        avg > 0 ? (over.some(Boolean)
          ? wzNote(`${over.filter(Boolean).length} mois dépassent ce que vous pouvez épargner (${E0.format(base)}). Réduisez un montant ou étalez vos achats.`, 'warn')
          : wzNote(`≈ ${E0.format(avg)} par mois, dans vos moyens${base > 0 ? ` (${E0.format(base)} disponibles)` : ''}.`, 'ok')) : wzP('Rien de prévu pour cette année.', 'wz-muted wz-c'),
        serList.length || T.p.length ? h('div', { class: 'wz-lines' },
          ...serList.map(bs => {
            const b = bs[0], ms = bs.map(x => x.m).sort((p, q) => p - q);
            return h('div', { class: 'wz-line' },
              h('span', { class: 'wz-line-ic' }, b.kind === 'Crypto' ? 'CRY' : b.kind === 'Action' ? 'ACT' : b.kind === 'Fonds' ? 'FDS' : 'ETF'),
              h('span', { class: 'wz-line-tx' }, h('span', { class: 'wz-line-t' }, b.name), h('span', { class: 'wz-line-s' }, `${envName(b.env)} · ${ms.length > 1 ? `${MONTH_NAMES[ms[0]].toLowerCase()} → ${MONTH_NAMES[ms[ms.length - 1]].toLowerCase()}` : MONTH_NAMES[ms[0]]}`)),
              h('span', { class: 'wz-line-v' }, `${E0.format(b.amt)}/mois`),
              h('button', { class: 'wz-x', 'aria-label': `Retirer ${b.name} du plan`, onclick: () => { T.b = T.b.filter(x => !bs.includes(x)); wzSave(); wzDraw(false); } }, getIcon('x', 14)));
          }),
          ...T.p.map(p => h('div', { class: 'wz-line' },
            h('span', { class: 'wz-line-ic' }, getIcon('lock', 15)),
            h('span', { class: 'wz-line-tx' }, h('span', { class: 'wz-line-t' }, p.name), h('span', { class: 'wz-line-s' }, `${envName(p.env)} · mise de côté`)),
            h('span', { class: 'wz-line-v' }, `${E0.format(p.amt)}/mois`),
            h('button', { class: 'wz-x', 'aria-label': `Retirer ${p.name}`, onclick: () => { T.p = T.p.filter(x => x !== p); wzSave(); wzDraw(false); } }, getIcon('x', 14))))) : null,
        mEnvs.length ? h('button', { class: 'wz-add', onclick: () => { P.d = null; stage('asset'); } }, getIcon('plus', 16), 'Ajouter un achat mensuel')
          : wzNote('Pour programmer des achats, ajoutez un PEA, un compte-titres ou une assurance vie à l’étape 1.'),
        sEnvs.length ? wzLink('Mettre aussi de côté sur un livret', () => stage('prov'), 'lock') : null
      ],
      next: { label: 'Terminer' }
    };
  },

  end: () => {
    const free = wzCap(), rows = wzGoalRows();
    const nb = [nowYear(), nowYear() + 1].reduce((t, y) => t + ((S.st || {})[y] ? S.st[y].b.filter(b => !b.done).length : 0), 0);
    return {
      center: true, back: false,
      art: wzSnowball({ still: true }),
      title: 'Votre boule de neige est lancée.',
      lead: 'Vos réponses forment votre tableau de bord. Tout reste modifiable.',
      body: [
        h('div', { class: 'wz-recap' },
          h('div', null, h('span', null, 'Ce que vous avez'), h('strong', null, E0.format(netWorthNow()))),
          h('div', null, h('span', null, 'Épargne possible par mois'), h('strong', null, E0.format(free))),
          h('div', null, h('span', null, 'Projets'), h('strong', null, rows.length ? String(rows.length) : '—')),
          h('div', null, h('span', null, 'Achats prévus'), h('strong', null, nb ? String(nb) : '—'))),
        wzP('Pensez à exporter une sauvegarde de temps en temps (Réglages).', 'wz-muted wz-small')
      ],
      next: { label: 'Découvrir mon tableau de bord', fn: () => { closeWizard(true); confetti(); go('#/'); } }
    };
  }
};

// Carte « Reprendre » sur l'accueil
function wzResumeCard() {
  const W = S.wz;
  if (!W || W.done || W.hide || WZ_OPEN) return null;
  const c = wzChapter(W.at || '');
  return h('div', { class: 'card wz-resume' },
    h('span', { class: 'wz-resume-ic' }, getIcon('snowball', 18)),
    h('div', { style: 'flex: 1; min-width: 0;' },
      h('div', { class: 'wz-resume-t' }, 'Reprendre là où vous en étiez'),
      h('div', { class: 'wz-resume-d' }, c >= 0 ? `Étape ${c + 1} sur 4 · ${WZ_CH[c].n}` : 'Votre parcours d’accueil')),
    h('button', { class: 'btn btn-primary btn-sm', onclick: () => openWizard() }, 'Reprendre'),
    h('button', { class: 'btn-icon-only', title: 'Masquer', 'aria-label': 'Masquer', onclick: () => { W.hide = true; save(); render(); } }, getIcon('x', 15)));
}

// Les fenêtres existantes s'ouvrent par-dessus le parcours : à leur fermeture, on rafraîchit l'étape
new MutationObserver(() => {
  const mr = document.getElementById('modal-root');
  if (WZ_OPEN && mr && !mr.children.length) wzDraw(false);
}).observe(document.getElementById('modal-root'), { childList: true });

document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  const mr = document.getElementById('modal-root');
  if (mr && mr.children.length) { mr.innerHTML = ''; return; }
  if (WZ_OPEN) closeWizard(false);
});

function render() {
  if (WZ_OPEN) return; // le parcours d'accueil couvre l'écran : la vue sera rendue à sa fermeture
  const r = (location.hash || '#/').slice(2).split('/');
  let k = r[0] || '';

  const views = {
    '': vHome,
    'c': () => vClass(r[1]),
    'e': () => vEnv(r[1]),
    'l': () => vLine(r[1], r[2]),
    'n': vNet,
    's': vStrat,
    'g': () => vGoalsR(r[1]),
    'u': vTools,
    'r': vRent
  };

  const currentView = views[k] || vHome;
  try {
    $('#app').replaceChildren(currentView());
    addHints($('#app'));
  } catch(err) {
    console.error(err);
    $('#app').replaceChildren(
      h('div', { class: 'card', style: 'padding: 24px; text-align: center;' },
        h('div', { style: 'font-weight: 700; color: var(--down);' }, 'Erreur d’affichage'),
        h('p', { style: 'font-size: 13px; color: var(--muted); margin: 6px 0 16px;' }, String(err && err.message || err)),
        h('button', { class: 'btn btn-primary btn-sm', onclick: () => go('#/') }, 'Retour à l’accueil')
      )
    );
  }

  updateNav(k);
  updateRelayStatusBadge();
}

function updateNav(k) {
  const activeIdx = k === 'n' ? 1 : k === 's' ? 2 : k === 'g' ? 3 : k === 'u' ? 4 : 0;
  
  const pendingBuysCount = (S.st && S.st[nowYear()] ? S.st[nowYear()].b.filter(b => isDueBuy(b, nowYear())).length : 0) + pendProv(nowYear()).length;

  const items = [
    { label: 'Patrimoine', icon: 'pie-chart', href: '#/' },
    { label: 'Frais', icon: 'percent', href: '#/n' },
    { label: 'Stratégie', icon: 'compass', href: '#/s', badge: pendingBuysCount },
    { label: 'Objectifs', icon: 'target', href: '#/g' },
    { label: 'Budget', icon: 'calculator', href: '#/u' }
  ];

  $('#nav-container').replaceChildren(
    ...items.map((item, idx) => {
      const link = h('a', {
        href: item.href,
        class: 'nav-link',
        'aria-current': idx === activeIdx ? 'page' : null
      },
        getIcon(item.icon, 20),
        h('span', null, item.label)
      );
      if (item.badge > 0) {
        link.append(h('span', { class: 'nav-badge' }, String(item.badge)));
      }
      return link;
    })
  );
}

window.addEventListener('hashchange', () => {
  render();
  window.scrollTo(0, 0);
});

// Démarrage initial
window.addEventListener('load', () => {
  render();
  if (S.wz && S.wz.open) openWizard();
  if (S.url) refreshQuotes();
});

setInterval(() => {
  if (S.url && !document.hidden) refreshQuotes();
}, 5 * 60 * 1000);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.url && (!M.t || Date.now() - M.t > 5 * 60 * 1000)) {
    refreshQuotes();
  }
});
</script>
</body>
</html>
